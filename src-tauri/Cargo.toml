[package]
name = "ai-dev-cockpit"
version = "0.1.0"
description = "AI Dev Cockpit — 开发者网络诊断台（只读诊断工具）"
authors = ["159357xxj"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_dev_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["socks"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }

# Phase 3：Windows 只读代理配置 API（WinINet 用户配置 + WinHTTP 默认配置）。
# windows-sys 已存在于依赖树（tauri 传递依赖），此处仅显式启用所需特性。
# Phase 6：导出使用系统原生"另存为"对话框（路径选择在 Rust 侧完成，
# 前端不传路径，收窄文件写入信任边界）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[dev-dependencies]
# Phase 4 补强 2：本地 TLS mock（测试专用受信证书；生产路径仍用 native-tls + 系统信任库）。
# ring 后端避免 aws-lc-rs 的 cmake/NASM 构建依赖。
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
