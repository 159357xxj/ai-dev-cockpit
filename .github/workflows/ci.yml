name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# F-05：显式最小权限——仅读取仓库内容；CI 不创建 Release、不改仓库设置/可见性。
permissions:
  contents: read

jobs:
  frontend:
    name: 前端质量基线
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  rust:
    name: Rust 质量基线
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Verify pinned Rust toolchain
        shell: pwsh
        working-directory: src-tauri
        run: |
          $v = (rustc --version)
          Write-Host $v
          if ($v -notmatch '^rustc 1\.97\.1 ') { throw "Expected rustc 1.97.1, got: $v" }
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # F-08: TLS mock tests depend on openssl.exe (test RSA cert generation).
      # windows-latest ships Git for Windows (with openssl); add it to PATH explicitly.
      # E-6：设置 PATH 与验证拆成两个 step——`$env:GITHUB_PATH` 只对**后续** step
      # 生效，同一步内 Get-Command 看不到刚追加的目录。
      - name: Put Git OpenSSL on PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
      - name: Verify OpenSSL
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Git\usr\bin\openssl.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "openssl.exe not found at $exe" }
          $resolved = (Get-Command openssl -ErrorAction Stop).Source
          Write-Host "openssl resolved to: $resolved"
          if ($resolved -ne $exe) { throw "openssl resolved to $resolved, expected $exe" }
          & $exe version
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # 手动触发的候选构建：产物上传为 artifact，不自动发布 Release。
  build-installer:
    name: 构建 NSIS 安装包（手动）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Verify pinned Rust toolchain
        shell: pwsh
        run: |
          $v = (rustc --version)
          Write-Host $v
          if ($v -notmatch '^rustc 1\.97\.1 ') { throw "Expected rustc 1.97.1, got: $v" }
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - name: 计算校验值
        working-directory: src-tauri/target/release/bundle/nsis
        run: Get-ChildItem *.exe, *.nsis.zip | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash + "  $($_.Name)" } | Tee-Object SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
